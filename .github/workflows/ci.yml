name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv and build package
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run Pytest
        run: |
          pytest --cov=src/git_triage_mcp --cov-report=xml

      - name: Build Wheel
        run: |
          pip install hatch
          hatch build